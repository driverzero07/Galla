name: galla
description: Galla - offline-first khata and billing app for small shops in Pakistan.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  drift: ^2.22.0
  drift_flutter: ^0.2.4

  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.2

  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  file_picker: ^8.1.6
  spreadsheet_decoder: ^2.3.1
  path: ^1.9.0
  sentry_flutter: ^8.12.0

  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: any # pinned by flutter_localizations

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700

# App icon and splash from the G logo (assets/icon/*.png). Applied by
# tool/setup.sh:  dart run flutter_launcher_icons  and
#                 dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#04260F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 23

flutter_native_splash:
  color: "#EEFBDD"
  image: assets/icon/splash.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#EEFBDD"
    image: assets/icon/splash.png
